<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#42C86E" />
    <title>Offline | Tokajo Warehouse</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f3f6f5;
        color: #14201e;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #42c86e;
        font-weight: 800;
        font-size: 28px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #3b4a47;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 10px;
        background: #42c86e;
        color: #14201e;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">T</span>
      <h1>No connection</h1>
      <p>
        The tablet is offline, so the live queue cannot load. Orders keep coming in on the server.
        Check the Wi-Fi, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
