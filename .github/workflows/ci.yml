name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "origin/${{ github.base_ref }}" --to HEAD

      - name: Format
        run: pnpm format:check

      - name: Migration lint (destructive statements need "-- allow-destructive")
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            base="HEAD^"
          else
            base=""
          fi
          if [[ -n "$base" ]]; then
            mapfile -t files < <(git diff --name-only --diff-filter=AM "$base" -- 'supabase/migrations/*.sql')
          else
            mapfile -t files < <(git ls-files 'supabase/migrations/*.sql')
          fi
          status=0
          for f in "${files[@]}"; do
            [[ -z "$f" ]] && continue
            if grep -Eiq '\b(drop[[:space:]]+(table|column|schema|type)|truncate)\b' "$f" && ! grep -q -- '-- allow-destructive' "$f"; then
              echo "::error file=$f::Destructive statement without '-- allow-destructive' marker"
              status=1
            fi
          done
          exit $status

      - name: Lint, typecheck, test, build (affected)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            filter="...[origin/${{ github.base_ref }}]"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            filter="...[HEAD^]"
          else
            filter=""
          fi
          if [[ -n "$filter" ]]; then
            pnpm turbo run lint typecheck test build --filter="$filter"
          else
            pnpm turbo run lint typecheck test build
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level high
