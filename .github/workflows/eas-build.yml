name: EAS build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-app, rider-app]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: eas build --platform all --profile "${{ inputs.profile || 'production' }}" --non-interactive --no-wait
